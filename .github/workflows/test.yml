name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sqlite-vec (no Ollama, no OpenAI SDK)
        run: python3 -m pip install -r requirements-embed.txt
      - name: Unit tests (no network, no model download)
        run: python3 -m unittest discover -s tests -v
