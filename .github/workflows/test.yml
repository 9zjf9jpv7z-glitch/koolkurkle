name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zsh (macos-slim scripts)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Unit tests (no network, no IMAP, no Keychain)
        run: python3 -m unittest discover -s tests -v
      - name: Rerank CRM smoke (shape gate; fail-open-only without weights)
        run: python3 scripts/rerank_smoke.py
